<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOH AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f19;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #202738;
  background:#101624;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#5eead4;
}

.menu{
  font-size:24px;
  cursor:pointer;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.welcome{
  text-align:center;
  margin-top:25vh;
}

.welcome h1{
  font-size:38px;
  margin-bottom:8px;
}

.welcome p{
  color:#9ca3af;
}

.message{
  max-width:80%;
  padding:12px 15px;
  margin:10px 0;
  border-radius:16px;
  line-height:1.5;
}

.user{
  background:#2563eb;
  margin-left:auto;
  border-bottom-right-radius:4px;
}

.ai{
  background:#1b2333;
  margin-right:auto;
  border-bottom-left-radius:4px;
}

.input-area{
  padding:12px;
  background:#101624;
  border-top:1px solid #202738;
  display:flex;
  gap:8px;
}

input{
  flex:1;
  padding:14px;
  border:none;
  outline:none;
  border-radius:14px;
  background:#1b2333;
  color:white;
  font-size:16px;
}

button{
  width:50px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-size:20px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}
</style>
</head>

<body>

<header>
  <div class="logo">YOH <span>AI</span> 🤖</div>
  <div class="menu">⋮</div>
</header>

<div class="chat" id="chat">

  <div class="welcome" id="welcome">
    <h1>YOH AI 🤖</h1>
    <p>Your smart AI assistant</p>
  </div>

</div>

<div class="input-area">
  <input
    id="messageInput"
    type="text"
    placeholder="Ask YOH AI anything..."
    autocomplete="off"
  >

  <button onclick="sendMessage()">➤</button>
</div>

<script>
function sendMessage(){

  const input = document.getElementById("messageInput");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  const text = input.value.trim();

  if(!text) return;

  if(welcome){
    welcome.remove();
  }

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;

  chat.appendChild(userMessage);

  input.value = "";

  const aiMessage = document.createElement("div");
  aiMessage.className = "message ai";
  aiMessage.textContent = "Hello! I'm YOH AI 🤖. I'm ready to help you.";

  chat.appendChild(aiMessage);

  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("messageInput").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    sendMessage();
  }
});
</script>

</body>
</html>
